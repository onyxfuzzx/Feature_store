services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: featureops_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: isolated-test-password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d featureops_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
