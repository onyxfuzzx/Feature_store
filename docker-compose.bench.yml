services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: featureops_bench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: disposable-benchmark-password
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d featureops_bench"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56380:6379"]
