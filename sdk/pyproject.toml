[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "featurestore-sdk"
version = "0.1.0"
authors = [
  { name = "FeatureOps Team" },
]
description = "Official Python SDK & CLI for Feature Store and Model Registry"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
]

[project.scripts]
featurestore = "featurestore.cli:main"
