[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "featurestore-sdk"
version = "0.1.0"
authors = [
  { name = "FeatureOps Team" },
]
description = "Official Python SDK & CLI for Feature Store and Model Registry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
featurestore = "featurestore.cli:main"
